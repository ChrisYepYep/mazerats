[build]
  command = "npm install"
  publish = "."

[functions]
  directory = "netlify/functions"

# The admin panel is unlinked from the site nav (not discoverable through
# browsing) and its write actions require a real logged-in admin session
# (username/password against the "admins" collection in MongoDB, see
# netlify/functions/auth.js — bcrypt-hashed passwords, JWT session tokens),
# so it no longer needs to be blocked outright — just reachable by anyone
# who knows the URL, same as any password-gated page.

# Serves admin.html at the clean /admin URL (a rewrite, status 200, so the
# address bar stays /admin rather than redirecting to /admin.html).
[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200

# The privacy policy as a page of its own, at a clean /privacy. It has
# always existed inside the homepage console and still does, unchanged —
# but a policy that lives only behind a modal hash cannot be linked to, cannot
# be indexed, and had to be read through a 204px window. Both render from the
# same wording in js/privacy-content.js, so they cannot drift.
[[redirects]]
  from = "/privacy"
  to = "/privacy.html"
  status = 200

# The daily game. It is a window on the homepage rather than a page of its
# own, so this serves home.html and js/guess.js opens the game when it sees
# the path — the same trick /wizard/<room> uses. A rewrite, not a redirect,
# so a link pasted as /guess keeps the address it was pasted as.
[[redirects]]
  from = "/guess"
  to = "/home.html"
  status = 200

# The Sorcerer's Atlas, at the clean /wizard URL. Same rewrite treatment
# as /admin above, so the address bar keeps the URL that was typed.
[[redirects]]
  from = "/wizard"
  to = "/wizard.html"
  status = 200

# A link straight to one room on that map. Also a rewrite to the same page:
# js/wizard.js reads the room id off location.pathname and opens that
# room's sheet with the map already flown to it, so /wizard/library is a
# real address a person can paste rather than a fragment the server never
# sees. Listed after the bare /wizard above because the first match wins.
[[redirects]]
  from = "/wizard/:id"
  to = "/wizard.html"
  status = 200

# publish = "." above means the whole repo root — including this directory
# of function SOURCE files — is otherwise served as plain static assets
# alongside the real site (e.g. mazerats.net/netlify/functions/contact.js
# would 200 with the raw source, distinct from the actual function
# endpoint at /.netlify/functions/contact). Doesn't leak secrets (those
# only ever live in env vars, never in these files), but it does hand out
# implementation details for free — exact rate-limit thresholds, the
# contact form's honeypot field name, etc. — with no reason a visitor
# should ever be hitting this path directly.
[[redirects]]
  from = "/netlify/functions/*"
  to = "/index.html"
  status = 404
  force = true

# The same reasoning as the block above, applied to everything else that
# came along with publish = ".". The command-line tools, the README, the
# package manifest, the dev launcher and the env template were all being
# served as ordinary static files — no secrets in any of them (.env is
# gitignored and has never been committed), but no reason a visitor should
# be reading the project's own tooling either.
[[redirects]]
  from = "/tools/*"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/README.md"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/package.json"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/package-lock.json"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/.env.example"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/start-dev.*"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/deno.lock"
  to = "/index.html"
  status = 404
  force = true

# Signing in with Discord. Two clean paths in front of one function, because
# /auth/discord/callback is an address that has to be typed by hand into
# Discord's developer portal and kept matching there forever — far better
# that than the function's own URL with a query string on it.
#
# Rewrites (200), and note what that means here: the deployed service
# forwards the INCOMING request's query string, not the one written in `to`
# — the same behaviour that broke the /maze/:id share links. So the action
# CANNOT be passed as ?action=callback in these lines; discord-auth.js reads
# it off the request path instead. The query that does arrive (Discord's
# own code and state, or the ?to= on the way out) is forwarded intact,
# which is exactly what is needed.
[[redirects]]
  from = "/auth/discord/start"
  to = "/.netlify/functions/discord-auth"
  status = 200

[[redirects]]
  from = "/auth/discord/callback"
  to = "/.netlify/functions/discord-auth"
  status = 200

# Generated from the archive itself rather than kept as a file — see
# netlify/functions/sitemap.js.
[[redirects]]
  from = "/sitemap.xml"
  to = "/.netlify/functions/sitemap"
  status = 200

# A shared maze or event link. The tags a chat client reads are written by
# the function (see netlify/functions/share.js), which then sends a real
# browser on to the archive with the right modal open. A rewrite (200), not
# a redirect: a crawler has to see the tags at the URL that was pasted.
#
# The id is NOT handed over as a query parameter. These read
# "…/share?maze=:id" until the placeholder was found to arrive only under
# `netlify dev`: on a 200 rewrite the deployed service forwards the INCOMING
# request's query string, which for a pasted /maze/<id> link is empty, so
# the query written here was dropped and every shared link reached the
# function with no id at all. The function reads the id off event.path
# instead — the request path is what survives a rewrite, and is what
# Netlify's own docs use for path parameters — so these are left as plain
# rewrites and local dev exercises the same branch production does.
[[redirects]]
  from = "/maze/:id"
  to = "/.netlify/functions/share"
  status = 200

[[redirects]]
  from = "/event/:id"
  to = "/.netlify/functions/share"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Nothing here uses a camera, a microphone or a location, so nothing
    # embedded in a page can quietly ask for one either.
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    # Written from what the site actually loads, which is a short list:
    # Google's font CSS and the font files it points at, the umami analytics
    # script, Habbo's own avatar imaging service, the pictures inside a
    # stored Habbo article, and FurniIndex's icons. Everything else is
    # first-party.
    #
    # cdn.discordapp.com is where a signed-in visitor's own Discord avatar
    # comes from — the small round picture on the header button and on a
    # leaderboard row. Nothing else is fetched from Discord by the browser:
    # the OAuth exchange all happens server-side in
    # netlify/functions/discord-auth.js, so discord.com itself never needs
    # to be in connect-src.
    #
    # images.habbo.com is a SEPARATE entry from www.habbo.com because a CSP
    # host is matched exactly — a subdomain is a different origin, and no
    # amount of www.habbo.com covers it. Habbo serves every picture in an
    # article from that host, so without it each one rendered as a broken
    # image in the middle of the piece. It buys nothing beyond the fetch: an
    # <img> cannot execute what it loads (an SVG included, and the article
    # sanitiser drops <svg> outright), and an article body is rebuilt tag by
    # tag against an allowlist before it is ever stored, with every src put
    # through safeUrl — see netlify/functions/article.js. Named singly
    # rather than as *.habbo.com, which would hand over every subdomain
    # Habbo has now or adds later for the sake of the one being used.
    #
    # 'unsafe-inline' is in script-src because the Coming Soon/Maintenance
    # gate has to run inline in <head>, ahead of every other resource, to
    # keep a gated page from painting (see home.html) — and in style-src
    # because the site sets inline styles all over the place while it
    # animates. Both are honest about what this policy is worth: it cannot
    # stop injected inline script, but it does stop script being pulled in
    # from anywhere that isn't on this list.
    #
    # connect-src names gateway.umami.is specifically: the analytics script
    # is SERVED from cloud.umami.is but POSTs its events to gateway.umami.is,
    # and a policy written from the script tag alone blocks every one of
    # them. (Verified against the real page — the console said so.)
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://cloud.umami.is; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://www.habbo.com https://images.habbo.com https://furniindex.com https://cdn.discordapp.com; connect-src 'self' https://cloud.umami.is https://gateway.umami.is; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'"

# The pixel art, the fonts and the sprite sheets never change without their
# filename changing, so there is no reason for a returning visitor to ask
# about them again. The HTML and the data endpoints are deliberately left
# alone — those are what carry new mazes.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The stylesheet and scripts are REVALIDATED rather than cached for a day,
# which is a correctness rule and not a performance one.
#
# They used to get max-age=86400 while the HTML got must-revalidate. That
# is fine only while markup, styles and script can each stand alone — and
# they cannot. A change that spans all three (the side tabs becoming one
# menu, say) reached a returning visitor as NEW markup with a DAY-OLD
# stylesheet and a day-old script: rules that matched nothing, wiring that
# looked for elements no longer in the page, and a menu that rendered
# unstyled and did nothing at all. There is no ordering that avoids it,
# because the HTML is always fresh and the other two are not.
#
# must-revalidate costs a conditional request per file per visit and
# almost always gets a 304 back — headers, no body — which is a small
# price for never again shipping a page assembled out of two different
# versions of itself. /assets/* keeps its year: pictures and fonts change
# by getting a new filename, so they genuinely are immutable.
#
# The proper fix is hashed filenames, which needs a build step this site
# deliberately does not have.
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

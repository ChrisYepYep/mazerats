[build]
  publish = "."

# The admin panel is only meant for local use — not linked from the site
# nav, and blocked here so it isn't reachable on the deployed domain even
# by direct URL. Run it locally (open admin.html straight from the repo,
# or serve the folder) if you need it.
[[redirects]]
  from = "/admin.html"
  to = "/"
  status = 302
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

<!doctype html>
<!-- Ariadne's Thread: the level editor (14 Oct 2026). Local only: served by
     tools/ariadne-editor/server.js, never published (Netlify's build deletes
     this folder). See the files beside this one for how it works. -->
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <title>Scout's Trail · Level editor</title>
    <link rel="icon" href="/assets/img/ariadne/key-icon.png">
    <link rel="stylesheet" href="editor.css">
</head>
<body>
<div id="app">
    <header id="top">
        <div class="brand"><img src="/assets/img/ariadne/key-icon.png" alt="" width="14" height="14"><span>Scout's Trail</span></div>
        <button id="passage-btn" class="passage" type="button" title="Choose a passage">
            <span id="passage-zone">…</span><span class="sep">·</span><span id="passage-name"></span><span id="dirty" class="dirty" hidden title="Unsaved changes"></span>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M7 10l5 5 5-5"/></svg>
        </button>
        <div class="divider"></div>
        <div id="tools" class="tools" role="toolbar" aria-label="Tools"></div>
        <div class="divider"></div>
        <div class="group">
            <button id="undo-btn" class="icon-btn" type="button" aria-label="Undo"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h11a5 5 0 010 10h-3"/></svg></button>
            <button id="redo-btn" class="icon-btn" type="button" aria-label="Redo"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 14l5-5-5-5"/><path d="M20 9H9a5 5 0 000 10h3"/></svg></button>
        </div>
        <div class="group">
            <button id="snap-btn" class="toggle" type="button" title="Snap to the grid (S). Off: place freely, to the pixel"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 4h16v16H4zM4 9.3h16M4 14.6h16M9.3 4v16M14.6 4v16"/></svg><span>Snap</span></button>
            <select id="grid-size" title="Grid step" aria-label="Grid step">
                <option value="16" selected>16 px</option><option value="8">8 px</option><option value="4">4 px</option><option value="2">2 px</option><option value="1">1 px</option><option value="32">32 px</option>
            </select>
        </div>
        <div class="group">
            <button id="view-collision" class="toggle" type="button" title="Collision boxes (C)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="8" height="8"/><rect x="13" y="13" width="8" height="8"/><path d="M13 3h8v8M3 13h8v8" stroke-dasharray="2 2"/></svg><span>Collision</span></button>
            <button id="view-lighting" class="toggle" type="button" title="Lighting preview: the dark of a dark passage (L)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 18h6M10 21h4M12 3a6 6 0 00-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0012 3z"/></svg><span>Lighting</span></button>
        </div>
        <div class="spacer"></div>
        <div class="group zoom">
            <button id="zoom-out" class="icon-btn" type="button" aria-label="Zoom out" title="Zoom out (−)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14"/></svg></button>
            <button id="zoom-val" class="zoom-val" type="button" title="Zoom to 200%">200%</button>
            <button id="zoom-in" class="icon-btn" type="button" aria-label="Zoom in" title="Zoom in (+)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg></button>
            <button id="zoom-fit" class="icon-btn" type="button" aria-label="The whole map" title="The whole map (0)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/></svg></button>
        </div>
        <button id="help-btn" class="icon-btn" type="button" aria-label="Keys" title="Keys (?)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 114 2c-1 .7-1.5 1.2-1.5 2.5M12 17.5v.1"/></svg></button>
        <button id="save-btn" class="btn" type="button" title="Save (Ctrl+S)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 4h11l3 3v13H5z"/><path d="M8 4v5h7V4M8 20v-6h8v6"/></svg><span id="save-label">Saved</span></button>
        <div class="play-group">
            <button id="play-btn" class="btn primary" type="button" title="Play from the pointer (T)"><svg width="14" height="14" viewBox="0 0 24 24"><path d="M7 4v16l13-8z" fill="currentColor"/></svg><span>Play</span></button>
            <button id="play-start" class="btn primary narrow" type="button" title="Play from the start (Shift+T)"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 4v16"/><path d="M9 4v16l11-8z" fill="currentColor" stroke="none"/></svg></button>
        </div>
    </header>

    <aside id="left">
        <div class="search"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><input id="lib-search" type="search" placeholder="Search the library" aria-label="Search the library" autocomplete="off"></div>
        <div id="library" class="library"></div>
        <div id="toolopts" class="toolopts"></div>
    </aside>

    <main id="stage">
        <canvas id="view" tabindex="0" aria-label="The map"></canvas>
        <div id="busy" class="busy" hidden><i></i><span>Drawing the map…</span></div>
        <div class="mini-wrap"><canvas id="minimap" width="220" height="110" hidden></canvas><button id="mini-toggle" class="icon-btn mini-btn" type="button" title="Map overview"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 6l6-2 6 2 6-2v14l-6 2-6-2-6 2z"/><path d="M9 4v14M15 6v14"/></svg></button></div>
        <div id="test" class="test" hidden>
            <div id="test-bar" class="test-bar">
                <span class="rec"></span><strong>Testing</strong><span id="t-where" class="dim"></span>
                <div class="spacer"></div>
                <button id="t-again" class="btn small" type="button" title="Again from the same place">Again</button>
                <button id="t-start" class="btn small" type="button" title="From the start">From the start</button>
                <button id="t-boxes" class="toggle small" type="button" title="Collision boxes (`)">Collision</button>
                <button id="t-god" class="toggle small" type="button" title="Nothing hurts him">Invincible</button>
                <button id="t-sound" class="icon-btn" type="button" title="Sound"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16 9a4 4 0 010 6M18.5 6.5a8 8 0 010 11"/></svg></button>
                <span id="t-scale" class="dim small"></span>
                <button id="t-stop" class="btn primary" type="button" title="Back to editing (Esc)"><svg width="12" height="12" viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" rx="2" fill="currentColor"/></svg><span>Stop</span></button>
            </div>
            <div class="test-screen"><canvas id="game" width="320" height="224" tabindex="0" aria-label="The game"></canvas></div>
            <p class="test-keys">Arrows run and climb · Space jumps · Down crouches · Z and X turn wheels · P pauses · Esc stops</p>
        </div>
        <div id="loading" class="loading"><div class="spinner"></div><span>Opening the passage…</span></div>
    </main>

    <aside id="right">
        <nav class="tabs" role="tablist">
            <button class="tab active" data-tab="inspect" type="button">Inspect</button>
            <button class="tab" data-tab="level" type="button">Level</button>
            <button class="tab" data-tab="layers" type="button">Layers</button>
            <button class="tab" data-tab="problems" type="button">Problems<span class="badge"></span></button>
        </nav>
        <div id="tab-inspect" class="panel"></div>
        <div id="tab-level" class="panel" hidden></div>
        <div id="tab-layers" class="panel" hidden></div>
        <div id="tab-problems" class="panel" hidden></div>
    </aside>

    <footer id="status">
        <span id="st-pos"></span><span id="st-tile"></span><span id="st-room"></span><span id="st-hover" class="hov"></span>
        <span class="spacer"></span>
        <span id="st-sel"></span><span id="st-snap"></span>
    </footer>
</div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script>window.AriadneEditor = true;</script>
<script src="/js/rat-race-music.js"></script>
<script src="/js/rat-race-epic.js"></script>
<script src="/js/rat-race-art.js"></script>
<script src="/js/rat-race-font.js"></script>
<script src="/js/rat-race-levels.js"></script>
<script src="/js/rat-race-zones.js"></script>
<script src="/js/rat-race.js"></script>
<script src="catalog.js"></script>
<script src="core.js"></script>
<script src="render.js"></script>
<script src="draw.js"></script>
<script src="input.js"></script>
<script src="ui.js"></script>
<script src="test.js"></script>
<script src="jukebox.js"></script>
<script src="main.js"></script>
</body>
</html>

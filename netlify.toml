# build-minify strips comments out of the CSS and JS as they go to the CDN.
# It rewrites files in place, which is safe here and only here: Netlify builds
# from a throwaway clone and publishes this directory, so nothing it touches
# is anybody's working copy. The script refuses to run anywhere else — see its
# own header for why that guard matters and why it uses real parsers rather
# than a regular expression.
#
# Measured on everything home.html loads: 309KB gzipped -> 94KB, a 70% cut,
# with style.css alone going 133KB -> 27KB. Nothing about how the code is
# written or read changes; the comments simply stop being downloaded by people
# who are here to look at mazes.
# themes.js runs BEFORE build-minify, and the order is not arbitrary: it
# reads css/style.css to build every palette override, and by the time minify
# has been through, that file has had its comments stripped and its rules
# rewritten. Generating from the minified copy would still work, but the
# output would be unreadable and would churn on every deploy.
#
# Running it here at all is what stops the theme going stale. The generated
# files are committed so local dev needs no build step, and a committed copy
# silently keeps the OLD colours the moment anyone edits style.css. Building
# it every deploy means the two cannot disagree on the live site.
#
# terser and clean-css are ordinary dependencies rather than dev ones, which
# looks wrong for build-only tools and is not. `npm install` skips
# devDependencies whenever NODE_ENV is production, and the minify step is not
# guarded — one environment variable set for an unrelated reason and the build
# command fails outright instead of just shipping bigger files. Nothing
# requires them at runtime, so listing them here costs nothing and removes
# that.
#
# The minify step deliberately has NO `|| true`: terser failing usually means
# a real syntax error in a source file, which is a signal worth stopping for.
#
# themes.js has no `|| true` either, any more. It used to, on the reasoning
# that a colour scheme is not worth failing a deploy over and the committed
# files would do — but a failure there was then completely silent, and the
# committed files had in fact already fallen behind style.css. "Carry on with
# the old palette" meant shipping stale colours with nobody told. It needs
# nothing the clone does not have (node's own fs/zlib/crypto and the PNGs it
# recolours, all in the repo), so a failure is a real fault worth stopping for.
# check-daily-parity runs FIRST. It used to compare how the browser and the
# server each derived a day's puzzle; the day is now dealt once, on the
# server, stored, and handed to the page (netlify/functions/_deal.js), so
# there is no second dealer to drift. What it checks now is the contract
# that replaced it — that the page is given no answers and plays the deal it
# is handed, and that the server judges against the stored one. See its own
# header. When either side of that breaks, nothing errors: correct answers
# are quietly scored wrong. That is worth failing a deploy over.
#
# The last step takes the dungeon bench (dungeon.html, js/dungeon.js) out of
# what is published (28 Sept 2026). It is unfinished, unlinked and noindex,
# but publish = "." served it at mazerats.net/dungeon.html to anyone who
# guessed the name. Removed from the build's throwaway clone rather than
# 404'd by a redirect, because `netlify dev` obeys redirects too and a
# redirect would shut the bench on the machine it is being built on.
[build]
  command = "npm install && node tools/check-daily-parity.js && node tools/check-changes.js && node tools/check-share-headers.js && node tools/themes.js && node tools/build-minify.js && rm -f dungeon.html js/dungeon.js"
  publish = "."

[functions]
  directory = "netlify/functions"
  # The stored furnidata, named explicitly rather than left to the bundler's
  # tracing. `require("./_furnidata.json")` in furni-meta.js is static and
  # every bundler Netlify has shipped would follow it — but this is the file
  # that decides which furni can be sat on, and a deploy that quietly leaves
  # it out gives Fallin' Furni no seats and no error. Two lines against a
  # silent failure. See netlify/functions/_furnidata.js.
  #
  # js/featured-days.js for the same reason, and it is the one file the
  # functions reach for outside their own directory. netlify/functions/
  # _daily.js requires it so that the salt applied to a featured day is
  # read from the SAME file the browser reads, rather than from a second
  # copy that can be edited on its own — see that file's header. The
  # require is static and the bundler would follow it; naming it here is
  # the belt to that braces, because the thing it prevents is silent.
  #
  # js/dead-ends.js likewise: dead-ends.js and dead-end-leads.js validate
  # the pieces a flag or a lead may name against the same table the archive
  # and /warren draw from. Left out, every flag would be refused on save.
  #
  # home.html because the share function serves it: /maze/<slug>,
  # /event/<slug> and /guides/<slug> are the archive page itself with that
  # record's preview tags written in (see netlify/functions/share.js). It
  # has a fallback that fetches the page over HTTP, but reading the bundled
  # copy is faster and cannot be answered by a stale edge.
  #
  # _furni-api-map.json (1 Oct 2026): the table _furni-payload.js uses to
  # send the furni pictures from FurniIndex's new API. Required statically
  # and in a try, so a bundle without it would quietly fall back to the
  # old host — which is exactly why it is named here as well. Since 2 Oct it
  # also carries `grown` (growing plants drawn at their last stage); rebuilt
  # by tools/furni-api-map.js.
  #
  # _habbo-names.json (1 Oct 2026): Habbo's own furni names, which
  # furni-catalogue.js searches for the Warren's picker to offer furni
  # FurniIndex hasn't catalogued yet, and (2 Oct) which _furni-payload.js
  # reads to turn a raw text key into a furni's real name and motto. Required
  # lazily, in a try, for the same quiet-failure reason: without it a maze's
  # furni list falls back to the text key. Rebuilt by tools/habbo-names.js.
  #
  # BOTH JSON FILES, AND THE TWO TOOLS THAT BUILD THEM, ARE NEW AND MUST BE
  # `git add`ed with the code that reads them: a dashboard deploy builds from
  # the pushed commit, and a file that is only on this machine is a file the
  # live site does not have — with no error, for the reasons above.
  #
  # _furni-catalogue-seed.json and _furni-legacy.json (5 Oct 2026), when the
  # furni catalogue moved to FurniIndex's new API. The seed is the full
  # catalogue furni-catalogue.js starts from, since walking the new API from
  # nothing takes minutes (rebuilt by tools/furni-catalogue-seed.js); the
  # legacy file is the old catalogue, frozen, which _furni-payload.js needs
  # to read the furni stored before the switch (see _furni-legacy.js). Both
  # are required in a try, so a bundle without them fails quietly: no
  # seed is a catalogue that fills over many refreshes, no legacy file is
  # every old detection's small sprite and classname lost. The same
  # `git add` warning applies to both, and to tools/furni-catalogue-seed.js.
  included_files = ["netlify/functions/_furnidata.json", "netlify/functions/_furni-api-map.json", "netlify/functions/_habbo-names.json", "netlify/functions/_furni-catalogue-seed.json", "netlify/functions/_furni-legacy.json", "netlify/functions/_furni-mirror.json", "js/featured-days.js", "js/dead-ends.js", "home.html"]

# ------------------------------------------------------------ THE ADMIN PANEL
#
# It lives at /warren, and it used to live at /admin.
#
# WHAT THE RENAME IS AND IS NOT FOR. It is not the lock. The lock is in
# netlify/functions/auth.js: bcrypt-hashed passwords, JWT session tokens,
# and a throttle of ten failed sign-ins per IP and fifteen per username per
# quarter of an hour, counted BEFORE any hashing so a refused attempt costs
# one indexed count rather than 45ms of CPU. Forty guesses an hour is not a
# door anybody opens by guessing.
#
# What the rename buys is quiet. The automated scanners that sweep every
# site on the internet ask for /admin, /wp-admin and /administrator by
# name, and each of those was a real page here — a function invocation, a
# row in the activity log, and a login form put in front of a robot. At
# /warren they get nothing, because nothing is there.
#
# THE FILE IS RENAMED, NOT REDIRECTED, and that is the part that matters.
# `publish = "."` serves the whole repo root, so admin.html was reachable
# at /admin.html whatever the redirects said — moving /admin alone would
# have left the page sitting in plain sight one URL over. The file is now
# warren.html, so /admin and /admin.html are not blocked so much as
# absent: they 404 the way any other address that was never a page does,
# which tells a scanner nothing at all.
#
# It is still unlinked from the site nav and still noindex in its own
# markup.
#
# AND IT IS NO LONGER IN robots.txt, which used to carry "Disallow: /admin".
# A Disallow line is a published list of the addresses somebody thought
# were worth hiding, served to anyone who asks and read by every scanner
# ever written — naming the panel there undid the reason for hiding it.
# Not even a comment survives in that file: robots.txt goes out to the
# public, so an explanatory note saying "the admin panel is deliberately
# not listed" still tells a reader there is one to look for. The reasoning
# lives here instead, in a file the site does not serve.
#
# Nothing is lost by the omission. The noindex in the page's own markup is
# what actually keeps it out of search results, and that has always been
# there; robots.txt was only ever saying it a second time, at the cost of
# advertising the address.
#
# THE ADDRESS IS STILL IN PUBLIC PAGE SOURCE, and it is worth being honest
# about that: home.html and fallinfurni.html each build an "Admin" pill for
# a verified admin, and the string "warren.html" is in those files whether
# or not the pill is ever drawn. Anybody who reads view-source can find it.
# That is a different threat from the one this addresses — a person looking
# on purpose, rather than a bot working through a list — and the answer to
# that one is the login throttle above, not the URL.

# The archive itself, at a clean /home.
#
# It had no rule of its own and worked anyway, because Netlify serves a
# pretty URL for every .html file it publishes — which is exactly why this
# is worth writing down. The behaviour that made /home resolve is a default
# somebody can turn off in a UI this repo does not contain, and the site now
# depends on it: js/guess.js rewrites /guess to /home on open, the links all
# point there, and the .html spelling below redirects to it. Stated here, the
# address survives the setting.
[[redirects]]
  from = "/home"
  to = "/home.html"
  status = 200

# --- and the filenames, sent to the clean address -----------------------
#
# Every page above answers to two URLs: the clean one and the .html one the
# file is actually called. The rewrites only ever decided what a clean URL
# SERVES; they said nothing about what happens when a visitor arrives at the
# filename, and the site walked them there itself — the brand link in the
# header of five pages was href="home.html", the landing page's own Enter
# button was href="home.html", and home.html's gate bounced with
# location.replace("index.html"). Click any of those and the address bar read
# /home.html for the rest of the visit, which then got pasted into Discord.
#
# 301 rather than a rewrite, and that is the whole point: a rewrite would
# serve the page at the filename and leave the filename in the bar, which is
# the thing being fixed. The links themselves are also corrected (see the
# commit) — this rule is for the ones already in the wild, in bookmarks and
# in pasted messages, which no edit here can reach.
#
# It also settles the canonical question these pages each carry a <link> tag
# about. Two URLs serving one document is a duplicate a crawler has to be
# told about; one URL redirecting to the other is not a duplicate at all.
#
# NOT CHAINED, so the rewrites above are unaffected: Netlify resolves a
# rewrite's target against the published files, and does not run the result
# back through this table. /guess still serves home.html and still shows
# /guess. Verified rather than assumed — see the note on the parity check.
#
# force = true ON EVERY ONE OF THEM, and without it none of these rules do
# anything at all. A redirect whose `from` matches a file that really exists
# is skipped by default — the file wins, silently — and every path here is by
# definition a real file, since being the filename is the whole reason it
# needs redirecting. Written without it first, and the local check showed
# seven 200s where seven 301s were wanted, which is exactly how this fails:
# not with an error, but by serving the page at the address being retired.
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/home.html"
  to = "/home"
  status = 301
  force = true

[[redirects]]
  from = "/privacy.html"
  to = "/privacy"
  status = 301
  force = true

[[redirects]]
  from = "/fallinfurni.html"
  to = "/fallinfurni"
  status = 301
  force = true

[[redirects]]
  from = "/quiz.html"
  to = "/quiz"
  status = 301
  force = true

[[redirects]]
  from = "/wizard.html"
  to = "/wizard"
  status = 301
  force = true

# Unlike the rest, no file stands behind this one any more: glyphs.html was
# folded into the homepage as the Alt Codes window. Kept so an old link or
# bookmark still lands on the sheet rather than on a 404.
[[redirects]]
  from = "/glyphs.html"
  to = "/glyphs"
  status = 301
  force = true

# warren.html is deliberately NOT in the list above. The panel's address is
# the filename — /warren is the rewrite, warren.html is the file — and a
# redirect from it would be a public confirmation that the page exists, at
# the one address this whole section is written to keep quiet. It stays as
# it is: two ways in, neither of them advertised.

# Serves warren.html at the clean /warren URL (a rewrite, status 200, so
# the address bar stays /warren rather than showing the filename).
[[redirects]]
  from = "/warren"
  to = "/warren.html"
  status = 200

# The privacy policy as a page of its own, at a clean /privacy. It has
# always existed inside the homepage console and still does, unchanged —
# but a policy that lives only behind a modal hash cannot be linked to, cannot
# be indexed, and had to be read through a 204px window. Both render from the
# same wording in js/privacy-content.js, so they cannot drift.
[[redirects]]
  from = "/privacy"
  to = "/privacy.html"
  status = 200

# The daily game. It is a window on the homepage rather than a page of its
# own, so this serves home.html and js/guess.js opens the game when it sees
# the path — the same trick /wizard/<room> uses. A rewrite, not a redirect,
# so a link pasted as /guess keeps the address it was pasted as.
#
# THROUGH THE SHARE FUNCTION (1 Oct 2026), not straight to home.html, and
# the same for /odd and /guides below: served as the file, a pasted link
# unfurled with the archive's own title and description, and its canonical
# said /home. share.js serves the same page with the window's own tags
# (FIXED_PAGES there), without touching the database.
[[redirects]]
  from = "/guess"
  to = "/.netlify/functions/share"
  status = 200

# The Guides window (js/guides.js): /guides is the homepage with the window
# open, and one guide is /guides?g=<id>. Its own preview tags, as /guess.
[[redirects]]
  from = "/guides"
  to = "/.netlify/functions/share"
  status = 200

# A guide's own address, on the same terms as /maze/:id below: the share
# function serves the archive page with the guide's title and thumbnail
# written in, and the page opens the Guides window on it.
[[redirects]]
  from = "/guides/:id"
  to = "/.netlify/functions/share"
  status = 200

# The other daily game, on the same terms and for the same reason: a result
# posted in a channel is a link somebody follows, and it should open the
# game rather than the archive with the game somewhere inside it.
#
# There was a /ratrospect here, and later a /onewall. Both games have been
# dropped and both rules went with them rather than being pointed at the
# archive as a courtesy: a rewrite that still served a page would leave the
# address looking alive and open a homepage with no game on it, which is a
# worse answer than the 404 an address that is no longer a page should give.
# Nothing of either is left to link to — see js/daily-loader.js for the
# roster.
[[redirects]]
  from = "/odd"
  to = "/.netlify/functions/share"
  status = 200

# Fallin' Furni. A page of its own rather than a window on the homepage, unlike
# the daily games above: it wants the whole viewport for the room, and it
# is not a once-a-day puzzle whose result gets pasted into a channel.
#
# A rewrite for the same reason as /admin and /wizard — the address bar keeps
# what was typed. It carried a robots noindex while the game was being built;
# that came off once all fifty rooms were finished, and this address is now
# the canonical one the page names and the one in the sitemap. Both URLs still
# serve the document, which is exactly why only one of them is canonical.
[[redirects]]
  from = "/fallinfurni"
  to = "/fallinfurni.html"
  status = 200

# Pura Panic (6 Oct 2026), a window on the homepage that opens itself when it
# sees /purapanic (js/home.js). Through the share function, as /odd is, for
# the window's own title, description and picture when the link is pasted;
# the function serves home.html with those tags put in.
[[redirects]]
  from = "/purapanic"
  to = "/.netlify/functions/share"
  status = 200

# Its first address, kept working for anyone who had it: sent on, for good.
[[redirects]]
  from = "/pura"
  to = "/purapanic"
  status = 301

# Quiz Night, the host's quiz app. A page of its own for the same reason
# Fallin' Furni is one — it wants the whole viewport, and it is not a daily
# puzzle whose result gets pasted into a channel. This one goes further and
# drops the site's header and nav entirely: it is held in one hand by a
# person talking to a room, and every pixel of chrome is a pixel not showing
# the question.
#
# A rewrite, so a link typed as /quiz stays /quiz in the address bar — which
# matters more here than anywhere else on the site, because this is a URL
# read out loud and typed in by hand.
[[redirects]]
  from = "/quiz"
  to = "/quiz.html"
  status = 200

# The Sorcerer's Atlas, at the clean /wizard URL. Same rewrite treatment
# as /admin above, so the address bar keeps the URL that was typed.
[[redirects]]
  from = "/wizard"
  to = "/wizard.html"
  status = 200

# A link straight to one room on that map. Also a rewrite to the same page:
# js/wizard.js reads the room id off location.pathname and opens that
# room's sheet with the map already flown to it, so /wizard/library is a
# real address a person can paste rather than a fragment the server never
# sees. Listed after the bare /wizard above because the first match wins.
[[redirects]]
  from = "/wizard/:id"
  to = "/wizard.html"
  status = 200

# The Alt Codes window (js/glyphs.js): /glyphs is the homepage with the
# picture-glyph sheet open, on the same terms as /guides above.
#
# It was a page of its own, glyphs.html, opened in a new tab from the
# archive's side menu. It is a window over the archive now, and the file is
# gone; the /glyphs.html redirect further up still sends an old link here.
#
# Still not indexed: robots.txt disallows /glyphs. Useful to somebody
# naming a room, meaningless in a search result.
[[redirects]]
  from = "/glyphs"
  to = "/home.html"
  status = 200

# Your Profile (4 Oct 2026): /profile is the homepage with the profile
# window open, and /profile?p=<public id> opens one player's. On the same
# terms as /glyphs above; js/home.js opens the window and puts the address
# back to /home, since the window keeps no address of its own. Not indexed
# (robots.txt): it shows whoever is looking their own browser's progress.
# Through the share function, which serves the same home.html with the
# Profiles link preview (assets/img/og-profiles.png, the Habbo Console).
[[redirects]]
  from = "/profile"
  to = "/.netlify/functions/share"
  status = 200

# And /profiles, the same (4 Oct 2026, the owner's): the window is titled
# Profiles, so that is what people type.
[[redirects]]
  from = "/profiles"
  to = "/.netlify/functions/share"
  status = 200

# publish = "." above means the whole repo root — including this directory
# of function SOURCE files — is otherwise served as plain static assets
# alongside the real site (e.g. mazerats.net/netlify/functions/contact.js
# would 200 with the raw source, distinct from the actual function
# endpoint at /.netlify/functions/contact). Doesn't leak secrets (those
# only ever live in env vars, never in these files), but it does hand out
# implementation details for free — exact rate-limit thresholds, the
# contact form's honeypot field name, etc. — with no reason a visitor
# should ever be hitting this path directly.
[[redirects]]
  from = "/netlify/functions/*"
  to = "/404.html"
  status = 404
  force = true

# The same reasoning as the block above, applied to everything else that
# came along with publish = ".". The command-line tools, the README, the
# package manifest, the dev launcher and the env template were all being
# served as ordinary static files — no secrets in any of them (.env is
# gitignored and has never been committed), but no reason a visitor should
# be reading the project's own tooling either.
[[redirects]]
  from = "/tools/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/README.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/package.json"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/package-lock.json"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/.env.example"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/start-dev.*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/deno.lock"
  to = "/404.html"
  status = 404
  force = true

# And the rest of what publish = "." sweeps in, found by listing the root
# rather than by remembering. /backups holds exported copies of the archive's
# own collections; /.claude is the working notes of whoever last edited the
# repo; /node_modules exists on the build machine because the build command
# runs npm install, so every dependency's source was servable from the live
# site. The whole of /netlify rather than only /netlify/functions, since the
# rule above covers one directory of it by name and nothing else. The dot
# files are listed singly: none of them is committed with anything secret in
# it (.env itself is gitignored and never reaches a deploy), but a site does
# not need to serve its own ignore list either.
#
# None of these can catch a real page. The site serves /css, /js, /assets,
# the .html files at the root, robots.txt, the sitemap and /.netlify/* — the
# last of which is a different path from /netlify/* by its leading dot, and
# is where the functions and the image CDN actually answer.
#
# force = true on every one, for the reason given above the filename
# redirects: these paths are real files, and without it the file wins.
[[redirects]]
  from = "/backups/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/.claude/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/node_modules/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/netlify/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/netlify.toml"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/.git/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/.gitignore"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/.gitattributes"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/.env"
  to = "/404.html"
  status = 404
  force = true

# Signing in with Discord. Two clean paths in front of one function, because
# /auth/discord/callback is an address that has to be typed by hand into
# Discord's developer portal and kept matching there forever — far better
# that than the function's own URL with a query string on it.
#
# Rewrites (200), and note what that means here: the deployed service
# forwards the INCOMING request's query string, not the one written in `to`
# — the same behaviour that broke the /maze/:id share links. So the action
# CANNOT be passed as ?action=callback in these lines; discord-auth.js reads
# it off the request path instead. The query that does arrive (Discord's
# own code and state, or the ?to= on the way out) is forwarded intact,
# which is exactly what is needed.
[[redirects]]
  from = "/auth/discord/start"
  to = "/.netlify/functions/discord-auth"
  status = 200

[[redirects]]
  from = "/auth/discord/callback"
  to = "/.netlify/functions/discord-auth"
  status = 200

# The two icon addresses browsers and crawlers ask for without being told:
# Google's result favicon and iOS "Add to Home Screen" both try the root
# before reading any <link>, and both were 404s. The files live with the
# other icons under /assets/icons/, linked from every page's <head>.
[[redirects]]
  from = "/favicon.ico"
  to = "/assets/icons/favicon.ico"
  status = 200

[[redirects]]
  from = "/apple-touch-icon.png"
  to = "/assets/icons/apple-touch-icon.png"
  status = 200

# Generated from the archive itself rather than kept as a file — see
# netlify/functions/sitemap.js.
[[redirects]]
  from = "/sitemap.xml"
  to = "/.netlify/functions/sitemap"
  status = 200

# A maze's or event's own address: /maze/<slug>, /event/<slug>. The share
# function (netlify/functions/share.js) serves the archive page itself with
# that record's preview tags written in, and the page opens the window from
# the address. One address for people and for previews, and the one the
# address bar shows while the window is open. An older address (the id, or
# the slug from before a rename) is answered with a 301 to the current one.
# A rewrite (200), not a redirect: a crawler has to see the tags at the URL
# that was pasted.
#
# The slug is NOT handed over as a query parameter. These read
# "…/share?maze=:id" until the placeholder was found to arrive only under
# `netlify dev`: on a 200 rewrite the deployed service forwards the INCOMING
# request's query string, which for a pasted /maze/<id> link is empty, so
# the query written here was dropped and every shared link reached the
# function with no id at all. The function reads the slug off event.path
# instead — the request path is what survives a rewrite, and is what
# Netlify's own docs use for path parameters — so these are left as plain
# rewrites and local dev exercises the same branch production does.
[[redirects]]
  from = "/maze/:id"
  to = "/.netlify/functions/share"
  status = 200

[[redirects]]
  from = "/event/:id"
  to = "/.netlify/functions/share"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Nothing here uses a camera, a microphone or a location, so nothing
    # embedded in a page can quietly ask for one either.
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    # Every address on this site is https already — Netlify redirects http to
    # it and has done since the domain was pointed here. This is about the
    # ONE request that redirect cannot protect: the first one, typed or
    # pasted without a scheme, which leaves the browser in plaintext and is
    # therefore the one worth intercepting. After this header has been seen
    # once, the browser upgrades every later address itself and never sends
    # that request at all.
    #
    # Two years because that is what preload lists want, and includeSubDomains
    # because there is nothing on a subdomain of mazerats.net to break —
    # the site, the functions and the images are all served from the apex.
    #
    # NOT preloaded (no `preload` directive). Getting on the list is a
    # submission; getting off it takes months, during which every browser
    # refuses plain http for the whole domain. The header alone is the part
    # that is free to undo, and it buys almost all of the protection.
    Strict-Transport-Security = "max-age=63072000; includeSubDomains"
    # Written from what the site actually loads, which is a short list:
    # Google's font CSS and the font files it points at, the umami analytics
    # script, Habbo's own avatar imaging service, the pictures inside a
    # stored Habbo article, and FurniIndex's icons. Everything else is
    # first-party.
    #
    # cdn.discordapp.com is where a signed-in visitor's own Discord avatar
    # comes from — the small round picture on the header button and on a
    # leaderboard row. Nothing else is fetched from Discord by the browser:
    # the OAuth exchange all happens server-side in
    # netlify/functions/discord-auth.js, so discord.com itself never needs
    # to be in connect-src.
    #
    # images.habbo.com is a SEPARATE entry from www.habbo.com because a CSP
    # host is matched exactly — a subdomain is a different origin, and no
    # amount of www.habbo.com covers it. Habbo serves every picture in an
    # article from that host, so without it each one rendered as a broken
    # image in the middle of the piece. It buys nothing beyond the fetch: an
    # <img> cannot execute what it loads (an SVG included, and the article
    # sanitiser drops <svg> outright), and an article body is rebuilt tag by
    # tag against an allowlist before it is ever stored, with every src put
    # through safeUrl — see netlify/functions/article.js. Named singly
    # rather than as *.habbo.com, which would hand over every subdomain
    # Habbo has now or adds later for the sake of the one being used.
    #
    # 'unsafe-inline' is in script-src because the Coming Soon/Maintenance
    # gate has to run inline in <head>, ahead of every other resource, to
    # keep a gated page from painting (see home.html) — and in style-src
    # because the site sets inline styles all over the place while it
    # animates. Both are honest about what this policy is worth: it cannot
    # stop injected inline script, but it does stop script being pulled in
    # from anywhere that isn't on this list.
    #
    # connect-src names gateway.umami.is specifically: the analytics script
    # is SERVED from cloud.umami.is but POSTs its events to gateway.umami.is,
    # and a policy written from the script tag alone blocks every one of
    # them. (Verified against the real page — the console said so.)
    #
    # origins.habbo.com is the Origins hotel's own host, and a third habbo
    # entry for the reason images.habbo.com is a second: a CSP host matches
    # exactly, so neither of the other two covers it, and pictures served
    # from it were blocked. Mirrored in netlify/functions/share.js, which
    # tools/check-share-headers.js holds to this line.
    #
    # api.furniindex.com for the same exact-match reason (30 Sept 2026): the
    # furni catalogue hands back icon addresses on that host, so every icon
    # a maze's furni list or the furni picker drew from it was blocked.
    # Since 1 Oct 2026 it is where nearly every furni picture comes from
    # (FurniIndex's new API: a maze's furni list and cards, the Warren's
    # picker, and js/furni-rain.js's seats); all of them are <img>s, and the
    # API answers each one itself, with no redirect to another host, so
    # img-src is the only directive that needs it — nothing fetch()es it,
    # which is why connect-src does not name it.
    #
    # The OLD host, furniindex.com, is gone from img-src (5 Oct 2026, the
    # owner's: FurniIndex is switching it off). Everything the new API holds
    # is drawn from it (tools/furni-api-map.js, then tools/furni-api-nearest.js
    # for the views that wouldn't match pixel for pixel), and the rest — furni
    # it doesn't hold, door0, poster_1000… — is this site's own copy under
    # assets/img/furni-legacy/ (netlify/functions/_furni-mirror.js), so 'self'.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://cloud.umami.is; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://www.habbo.com https://images.habbo.com https://origins.habbo.com https://api.furniindex.com https://cdn.discordapp.com; connect-src 'self' https://cloud.umami.is https://gateway.umami.is; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'"

# How long a returning visitor's browser may keep the pixel art, the fonts
# and the sprite sheets without asking again. The HTML and the data
# endpoints are deliberately left alone — those are what carry new mazes.
#
# A DAY, NOT A YEAR, FOR ANYTHING FETCHED BY A FIXED NAME (30 Sept 2026).
# These folders used to get a year and "immutable" on the promise that a
# file never changes without its filename changing. That promise has not
# held: sprites, room art and furni in them have been redrawn and saved over
# in place, and a browser holding a year-long immutable copy would never have
# seen the new one. So /assets/img, /assets/furni, /assets/room,
# /assets/rooms and /assets/avatar now get a day, with a week of
# stale-while-revalidate so a visitor past the day is still served at once
# from their own cache while the fresh copy is fetched behind it.
#
# The year stays only where the address itself changes with the file:
#   · /assets/fonts/ — the two Volter files, which never change.
#   · The theme images under /assets/img/<theme>/ ARE versioned (the theme
#     stylesheets ask for each as ?v=<its content hash>), but they share
#     /assets/img with the unversioned top-level art and a rule of their own
#     would overlap it (see below), so they take the folder's day. They
#     still update the moment their hash changes; they are just asked about
#     once a day in between.
#
# ONE RULE PER FOLDER, NOT /assets/*. A more specific rule cannot safely be
# laid over a general one here: when two [[headers]] rules match a path and
# set the same header, production Netlify can send BOTH values joined with a
# comma — "max-age=31536000, immutable, max-age=0, must-revalidate", which a
# browser is free to read as the year — while `netlify dev` lets the later
# rule win, so a local check would not show it. Rather than depend on which,
# every folder is listed on its own, and anything not listed (a folder added
# later, a file at the top of /assets) falls back to Netlify's default of
# revalidating, which is the safe way to be wrong.
#
#   · /assets/furni-icons/ carries index.json, the catalogue the room editor
#     reads, which changes whenever an icon is added. A day.
#   · /assets/icons/ is the favicon and the home-screen icon, which are
#     fetched by fixed name from every page's <head>. A day, so a redrawn
#     icon reaches people this week rather than next year.
#
# /assets/furni and /assets/room are written /:file, not /*. A splat here
# also matches without its slash — "/assets/furni/*" matched
# /assets/furni-icons/index.json and "/assets/room/*" matched /assets/rooms/,
# putting two rules back on one path (checked with Netlify's own headers
# parser). Both folders are flat, so one path segment is all they need.
[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/furni/:file"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/assets/avatar/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/assets/room/:file"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/assets/rooms/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/assets/furni-icons/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/assets/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# Resized images are kept in the DURABLE cache, not just at the edge.
#
# This is the same opt-in the data endpoints needed (see _cache.js). The
# Image CDN already answers with max-age=31536000, immutable, which reads
# like the strongest possible caching and is not: that header governs the
# BROWSER. The edge keeps its own copy under its own rules, and without the
# "durable" directive that copy is short-lived and per-node.
#
# Measured against production before the change — four identical requests
# for one transform, back to back:
#
#   fwd=miss  fwd=stale  fwd=miss  fwd=stale   (Age: 0, 0, 0, 1)
#
# Every one of them went forward and re-transformed the original, at 400ms
# to 1.1s each. A maze modal asks for a large image plus a tray of
# thumbnails, so that cost was being paid ten or more times over, by every
# visitor, on every open — and it is why the pictures arrived one at a time
# instead of all at once.
#
# A transform is a pure function of (source image, query string), and the
# query string is part of the cache key (see the Netlify-Vary the endpoint
# answers with), so asking for a different size or quality is a different
# URL and cannot be served the old answer.
#
# A DAY AT THE EDGE, NOT A YEAR. It was a year, immutable, on the reasoning
# that no source image is rewritten in place (uploads are keyed
# <timestamp>-<slug>.<ext> in upload.js, so a replaced picture is a new
# URL). That covers REPLACING a picture and not REMOVING one: a deleted
# upload, or one taken down on request, went on being served through every
# resized URL already in the edge cache — for up to a year, however short a
# life image.js gives the original. A deletion or a takedown has to take
# effect within a day, so s-maxage is a day.
#
# stale-while-revalidate keeps what the durable cache was for: after the
# day, the next visitor is still answered at once from the old copy while
# the edge re-checks the original behind them, so a popular picture is not
# re-transformed on somebody's clock. It does not stretch a deletion past
# the day by more than a request: the first visitor after it may still get
# the old copy, and the re-check that visit sets off finds the original
# gone and replaces it.
#
# Not verifiable with `netlify dev`: the local server applies no custom
# headers to /.netlify/images at all, not even the site-wide ones it does
# apply in production. Confirm after deploying with
#   curl -sD- -o/dev/null 'https://mazerats.net/.netlify/images?url=assets/…&w=110&q=55'
# and look for Cache-Status: ...; hit on the second request.
[[headers]]
  for = "/.netlify/images*"
  [headers.values]
    Netlify-CDN-Cache-Control = "public, durable, s-maxage=86400, stale-while-revalidate=604800"

# The stylesheet and scripts are REVALIDATED rather than cached for a day,
# which is a correctness rule and not a performance one.
#
# They used to get max-age=86400 while the HTML got must-revalidate. That
# is fine only while markup, styles and script can each stand alone — and
# they cannot. A change that spans all three (the side tabs becoming one
# menu, say) reached a returning visitor as NEW markup with a DAY-OLD
# stylesheet and a day-old script: rules that matched nothing, wiring that
# looked for elements no longer in the page, and a menu that rendered
# unstyled and did nothing at all. There is no ordering that avoids it,
# because the HTML is always fresh and the other two are not.
#
# must-revalidate costs a conditional request per file per visit and
# almost always gets a 304 back — headers, no body — which is a small
# price for never again shipping a page assembled out of two different
# versions of itself. The /assets folders are on their own rules above: a
# day for everything fetched by a fixed name, and a year only for the fonts,
# which never change. (This used to say every /assets folder kept a year;
# that stopped being true on 30 Sept 2026 — see the note above those rules.)
#
# The proper fix is hashed filenames, which needs a build step this site
# deliberately does not have.
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# The Sorcerer's Atlas stays out of search results (28 Sept 2026). robots.txt
# used to Disallow it, which is the wrong tool: a crawler that may not fetch
# the page never sees wizard.html's noindex, and a disallowed URL that other
# sites link to can still be listed, bare, with no description. So robots.txt
# now lets it be fetched and this says, on every spelling of the address,
# not to index it. Lift both (and the meta tag) when the Atlas is ready.
[[headers]]
  for = "/wizard"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/wizard/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/wizard.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

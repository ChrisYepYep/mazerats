[build]
  command = "npm install"
  publish = "."

[functions]
  directory = "netlify/functions"

# The admin panel is unlinked from the site nav (not discoverable through
# browsing) and its write actions require the ADMIN_PASSWORD env var via
# the API, so it no longer needs to be blocked outright — just reachable
# by anyone who knows the URL, same as any password-gated page.

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
